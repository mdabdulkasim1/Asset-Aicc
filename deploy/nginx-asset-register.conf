# Put the register behind nginx when it is reachable from outside the office,
# so sign-ins are not sent in the clear. Get the certificate first, e.g.
#   sudo certbot --nginx -d assets.example.com

server {
    listen 80;
    server_name assets.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name assets.example.com;

    ssl_certificate     /etc/letsencrypt/live/assets.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assets.example.com/privkey.pem;

    # CSV exports and long asset lists.
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
