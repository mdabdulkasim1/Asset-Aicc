<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asset Register</title>
<meta name="description" content="Group asset control and barcode labelling">
<meta name="theme-color" content="#0f4c81">
<meta name="color-scheme" content="light">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Assets">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230f4c81'/><g fill='%23fff'><rect x='7' y='9' width='2' height='14'/><rect x='11' y='9' width='1' height='14'/><rect x='14' y='9' width='3' height='14'/><rect x='19' y='9' width='1' height='14'/><rect x='22' y='9' width='2' height='14'/></g></svg>">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<!-- Sign in -->
<div id="login-view" class="login-wrap" hidden>
  <form class="login-card" id="login-form" autocomplete="on">
    <h1>Asset Register</h1>
    <p class="sub">Group asset control &amp; barcode labelling</p>
    <div id="login-error" class="alert error hidden"></div>
    <div class="field" style="margin-bottom:12px">
      <label for="login-username">Username</label>
      <input id="login-username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field" style="margin-bottom:18px">
      <label for="login-password">Password</label>
      <div class="pw-wrap">
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        <button type="button" class="pw-eye" data-for="login-password" aria-label="Show password" aria-pressed="false"></button>
      </div>
    </div>
    <button class="btn block" type="submit" id="login-submit">Sign in</button>
  </form>
</div>

<!-- Application -->
<div id="app" class="app">
  <header class="topbar">
    <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Menu">&#9776;</button>
    <div class="brand">Asset Register<small id="brand-sub">Group asset control</small></div>
    <div class="spacer"></div>
    <div class="who">
      <span class="fullname" id="who-name"></span>
      <span class="tag role" id="who-role"></span>
    </div>
    <button class="btn small ghost" id="install-btn" type="button" hidden
            style="color:#fff;border-color:rgba(255,255,255,.4)">Install app</button>
    <button class="btn small ghost" id="logout-btn" type="button" style="color:#fff;border-color:rgba(255,255,255,.4)">Sign out</button>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="content" id="view"></main>
  </div>
</div>

<div id="print-area"></div>
<div id="toast" class="toast"></div>

<script src="/js/barcode.js"></script>
<script src="/js/api.js"></script>
<script src="/js/labels.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
